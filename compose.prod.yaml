services:

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    ports:
      - "80:80"
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy


  mongodb:
    image: mongo:8
    container_name: taskflow-mongo
    restart: unless-stopped

    volumes:
      - taskflow-mongo-data:/data/db


  redis:
    image: redis:latest
    container_name: taskflow-redis
    restart: unless-stopped


  api:
    build: .
    container_name: taskflow-api
    ports:
      - "3000:3000"
    restart: unless-stopped

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379
      MONGODB_URI: mongodb://mongodb:27017/

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started


  worker:
    build: .
    container_name: taskflow-worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379
      MONGODB_URI: mongodb://mongodb:27017/

    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

    command: node src/workers/jobWorker.js


volumes:
  taskflow-mongo-data: